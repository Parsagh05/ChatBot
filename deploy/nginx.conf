server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    # the pages call the API on the same origin under /api
    location = /config.js {
        alias /etc/nginx/chatbot/config.js;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # overwrite (not append) so visitors cannot spoof their IP and dodge rate limits
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # pass streamed answers (Server-Sent Events) through as they are generated
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
