services:
  backend:
    build: .
    env_file: backend/.env
    # container paths; these override the local-development paths in backend/.env
    environment:
      CHROMA_DB_PATH: /data/chroma_db
      PRODUCT_DB_PATH: /data/products.db
      DATA_DIR: /data/app
      KNOWLEDGE_BASE_DIR: /knowledge_base
    volumes:
      # index, products/feedback DB, site snapshot, dashboard settings and the embedding model cache
      - chatbot-data:/data
      # raw_docs/, QA.json and optional knowledge_base.json; edit on the host, then "Rebuild index"
      - ./knowledge_base:/knowledge_base:ro
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/config.docker.js:/etc/nginx/chatbot/config.js:ro
    restart: unless-stopped

volumes:
  chatbot-data:
